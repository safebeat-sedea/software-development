name: Resolving GitHub Vulnerabilities
description: >-
  Use GitHub CLI to inventory Dependabot / advisory / code-scanning alerts and
  recommended fixes, then apply dependency patches per repo-specific runbooks
  (Poetry/Yarn app READMEs; uv, npm, Terraform, Helm for infra and ml-flows)
  and ship through Software Development coding-session.
commands:
  - phrase: resolve github vulnerabilities
    description: >-
      Check GitHub vulnerability alerts with gh, triage recommended fixes, and
      patch lockfiles and dependency pins per scoped repo procedures (app,
      ucsf-study, infra, ml-flows).
